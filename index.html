<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="meta-title">A.R.S.A — Shared Song</title>
  <meta name="description" id="meta-desc" content="Listen to shared music on A.R.S.A — Ad-free, open-source music player with high-fidelity audio. Powered by ARYAVL.COM">

  <!-- Open Graph / WhatsApp / Discord / Telegram -->
  <meta property="og:type" content="music.song">
  <meta property="og:site_name" content="A.R.S.A">
  <meta property="og:title" id="og-title" content="A.R.S.A — Stream Ad-Free">
  <meta property="og:description" id="og-desc" content="Stream ad-free with synchronized lyrics. Pure Sound • Powered by ARYAVL.COM">
  <meta property="og:image" id="og-image" content="https://listen.aryavl.com/assets/og-preview.jpg">
  <meta property="og:image:secure_url" content="https://listen.aryavl.com/assets/og-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" id="og-url" content="https://listen.aryavl.com">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="tw-title" content="A.R.S.A — Stream Ad-Free">
  <meta name="twitter:description" id="tw-desc" content="Stream ad-free with synchronized lyrics. Pure Sound • Powered by ARYAVL.COM">
  <meta name="twitter:image" id="tw-image" content="https://listen.aryavl.com/assets/og-preview.jpg">

  <meta name="theme-color" content="#0a0010">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-ink:          #0a0010;
      --color-ink-deep:     #05000a;
      --color-bone:         #f0ecff;
      --color-bone-muted:   #9e96b8;
      --color-bone-dim:     #5e567a;
      --color-dominant:     #9d4edd;
      --color-dominant-alt: #6c2bd9;
      --color-dominant-glow: rgba(157, 78, 221, 0.4);
      --color-accent:       #00d4ff;

      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans:  'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono:  'Space Mono', monospace;

      --glass-blur:       28px;
      --glass-saturate:   190%;
      --glass-brightness: 1.08;

      --glass-border-light: rgba(200, 170, 255, 0.22);
      --glass-border-dark:  rgba(200, 170, 255, 0.04);
      --glass-specular:     rgba(200, 170, 255, 0.18);
      --glass-shadow:       0 32px 70px -15px rgba(0, 0, 0, 0.85), 0 12px 28px -10px rgba(10, 0, 16, 0.7);

      --radius-lg:   32px;
      --radius-pill: 999px;
      --transition:  transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, background 0.3s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body { height: 100%; }

    body {
      background-color: var(--color-ink);
      color: var(--color-bone);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 32px 20px 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background */
    .backdrop-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      will-change: transform;
      mix-blend-mode: screen;
      opacity: 0.55;
    }

    .shape-1 {
      width: 620px;
      height: 620px;
      background: radial-gradient(circle, var(--color-dominant) 0%, rgba(108, 43, 217, 0.5) 45%, transparent 75%);
      top: -120px;
      left: 5%;
      animation: driftSlow 32s ease-in-out infinite alternate;
    }

    .shape-2 {
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, #001a2d 0%, #000d1a 50%, transparent 75%);
      bottom: -80px;
      right: 10%;
      animation: driftReverse 36s ease-in-out infinite alternate;
    }

    .shape-3 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.25) 0%, transparent 70%);
      bottom: 10%;
      left: -60px;
      animation: driftSlow 28s ease-in-out infinite alternate-reverse;
    }

    .film-grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @keyframes driftSlow {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(50px, 60px, 0) scale(1.1); }
    }
    @keyframes driftReverse {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-60px, -50px, 0) scale(1.08); }
    }

    svg.filters-def {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-capsule {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      background: rgba(157, 78, 221, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(157, 78, 221, 0.25);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-bone);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .brand-capsule:hover {
      background: rgba(157, 78, 221, 0.18);
      border-color: rgba(157, 78, 221, 0.4);
    }

    .brand-capsule span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-dominant);
      box-shadow: 0 0 10px var(--color-dominant), 0 0 20px rgba(157, 78, 221, 0.4);
      display: inline-block;
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--color-dominant), 0 0 20px rgba(157, 78, 221, 0.4); }
      50%       { opacity: 0.7; box-shadow: 0 0 6px var(--color-dominant); }
    }

    /* Main Card */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      margin: auto 0;
    }

    .glass-card {
      position: relative;
      width: 100%;
      background: linear-gradient(
        145deg,
        rgba(157, 78, 221, 0.12) 0%,
        rgba(255, 255, 255, 0.04) 40%,
        rgba(10, 0, 16, 0.5) 100%
      );
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
      border-radius: var(--radius-lg);
      padding: clamp(24px, 5vw, 36px);
      box-shadow: var(--glass-shadow);
      isolation: isolate;
      overflow: hidden;
      text-align: center;
      transition: var(--transition);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        135deg,
        var(--glass-border-light) 0%,
        rgba(157, 78, 221, 0.1) 35%,
        transparent 65%,
        var(--glass-border-dark) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 2;
    }

    .glass-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle 320px at var(--mouse-x, 50%) var(--mouse-y, 0%),
        var(--glass-specular),
        transparent 70%
      );
      opacity: 0.5;
      pointer-events: none;
      z-index: 3;
    }

    /* Cover Art */
    .cover-art-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 20px;
      overflow: hidden;
      background: #0a0010;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(157, 78, 221, 0.2);
      margin-bottom: 24px;
    }

    .cover-art-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .cover-art-wrapper:hover img { transform: scale(1.03); }

    .art-reflection {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.12) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Song Info */
    .song-title {
      font-family: var(--font-serif);
      font-size: clamp(1.45rem, 3.2vw, 1.95rem);
      font-weight: 500;
      line-height: 1.22;
      color: #ffffff;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .song-artist {
      font-size: 1.05rem;
      color: var(--color-bone-muted);
      margin-bottom: 28px;
      font-weight: 400;
    }

    /* Buttons */
    .actions-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      position: relative;
      z-index: 5;
    }

    .glass-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      border: none;
      outline: none;
      user-select: none;
      transition: var(--transition);
    }

    .glass-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .glass-btn-primary {
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.8) 0%, rgba(108, 43, 217, 0.45) 100%);
      border: 1px solid rgba(200, 150, 255, 0.4);
      color: #ffffff;
      box-shadow: 0 12px 28px -6px var(--color-dominant-glow);
    }

    .glass-btn-primary:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.95) 0%, rgba(108, 43, 217, 0.6) 100%);
      box-shadow: 0 16px 36px -4px var(--color-dominant-glow);
    }

    .glass-btn-primary:active { transform: translateY(1px) scale(0.98); }

    .glass-btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--color-bone);
    }

    .glass-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .glass-btn-secondary:active { transform: translateY(1px) scale(0.98); }

    /* Footer */
    .site-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      text-align: center;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid rgba(157, 78, 221, 0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-desc {
      font-size: 0.84rem;
      color: var(--color-bone-muted);
      line-height: 1.5;
    }

    .footer-meta-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--color-bone-dim);
      margin-top: 4px;
    }

    .footer-meta-row a {
      color: var(--color-bone-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-meta-row a:hover { color: #fff; }

    .powered-by {
      color: var(--color-dominant);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
    }

    .powered-by:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <svg class="filters-def" aria-hidden="true">
    <defs>
      <filter id="glass-lens" x="-10%" y="-10%" width="120%" height="120%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <feBlend in="SourceGraphic" in2="displaced" mode="overlay" />
      </filter>
    </defs>
  </svg>

  <!-- Ambient Stage -->
  <div class="backdrop-stage" aria-hidden="true">
    <div class="bg-shape shape-1" id="shape1"></div>
    <div class="bg-shape shape-2" id="shape2"></div>
    <div class="bg-shape shape-3" id="shape3"></div>
  </div>

  <div class="film-grain" aria-hidden="true"></div>

  <!-- Brand Capsule -->
  <header class="top-bar">
    <a href="/" class="brand-capsule">
      <span></span> A.R.S.A
    </a>
  </header>

  <!-- Song Card -->
  <main class="main-container">
    <div class="glass-card" id="song-card">

      <div class="cover-art-wrapper">
        <img id="cover-art" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=85" alt="Song Cover Art">
        <div class="art-reflection"></div>
      </div>

      <h1 class="song-title" id="song-name">Loading song...</h1>
      <p class="song-artist" id="song-artist">A.R.S.A</p>

      <div class="actions-group">
        <a href="#" class="glass-btn glass-btn-primary" id="btn-open-arsa">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Open in A.R.S.A
        </a>
        <a href="https://download.app.aryavl.com" class="glass-btn glass-btn-secondary" id="btn-download-arsa" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download A.R.S.A
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p class="footer-desc">
      A.R.S.A is an ad-free, open-source music player featuring synchronized lyrics, gapless playback, and high-fidelity audio streams.
    </p>
    <div class="footer-meta-row">
      <span>HOSTED AT: <a href="https://listen.aryavl.com">listen.aryavl.com</a></span>
      <span>•</span>
      <span><a href="https://github.com/aryavl/arsa" target="_blank" rel="noopener">SOURCE (GPL-3.0)</a></span>
      <span>•</span>
      <span>POWERED BY <a href="https://aryavl.com" target="_blank" rel="noopener" class="powered-by">ARYAVL.COM</a></span>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      const PACKAGE    = 'com.arsa.aryavl';
      const ACTIVITY   = 'com.arsa.aryavl.WelcomeActivity';
      const DOWNLOAD   = 'https://download.app.aryavl.com';
      const DOMAIN     = 'listen.aryavl.com';

      // 1. Specular highlight follows cursor
      const card = document.getElementById('song-card');
      window.addEventListener('pointermove', (e) => {
        if (!card) return;
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
        card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
      }, { passive: true });

      // 2. 3D Tilt
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!prefersReducedMotion && card) {
        let reqId = null;
        card.addEventListener('pointermove', (e) => {
          const rect = card.getBoundingClientRect();
          const px = (e.clientX - rect.left) / rect.width - 0.5;
          const py = (e.clientY - rect.top) / rect.height - 0.5;
          if (reqId) cancelAnimationFrame(reqId);
          reqId = requestAnimationFrame(() => {
            card.style.transform = `perspective(1000px) rotateX(${(-py * 6).toFixed(2)}deg) rotateY(${(px * 6).toFixed(2)}deg) translateY(-2px)`;
          });
        });
        card.addEventListener('pointerleave', () => {
          if (reqId) cancelAnimationFrame(reqId);
          card.style.transform = '';
        });
      }

      // 3. URL parser — supports listen.aryavl.com URL formats + YouTube URLs
      function parseMedia(urlStr) {
        try {
          const u = new URL(urlStr.startsWith('http') ? urlStr : 'https://' + urlStr);
          let videoId    = u.searchParams.get('v');
          let playlistId = u.searchParams.get('list');
          let artistId   = null;

          if (!videoId) {
            // /watch/<id> | /song/<id> | /<id> (bare 11-char)
            const vMatch = u.pathname.match(/^\/(?:watch|song|v)\/([a-zA-Z0-9_-]{11})/);
            if (vMatch) videoId = vMatch[1];
            else {
              const bareMatch = u.pathname.match(/^\/([a-zA-Z0-9_-]{11})$/);
              if (bareMatch) videoId = bareMatch[1];
              else if (u.hostname === 'youtu.be') {
                const seg = u.pathname.split('/').filter(Boolean)[0];
                if (seg && seg.length === 11) videoId = seg;
              }
            }
          }
          if (!playlistId) {
            const pMatch = u.pathname.match(/^\/playlist\/([a-zA-Z0-9_-]+)/);
            if (pMatch) playlistId = pMatch[1];
          }
          const aMatch = u.pathname.match(/^\/(?:channel|artist)\/([a-zA-Z0-9_-]+)/);
          if (aMatch) artistId = aMatch[1];

          return { videoId, playlistId, artistId };
        } catch (e) {
          return {};
        }
      }

      const coverArt   = document.getElementById('cover-art');
      const songName   = document.getElementById('song-name');
      const songArtist = document.getElementById('song-artist');
      const btnOpen    = document.getElementById('btn-open-arsa');
      const metaTitle  = document.getElementById('meta-title');

      function buildDeepLink(videoId, playlistId, artistId) {
        let path = '';
        if (videoId)    path = `watch?v=${videoId}`;
        else if (playlistId) path = `playlist?list=${playlistId}`;
        else if (artistId)   path = `channel/${artistId}`;

        // ARSA custom scheme
        const arsaScheme  = `arsa://${path}`;
        // Explicit component intent → WelcomeActivity
        const intentMain  = `intent://music.youtube.com/${path}#Intent;scheme=https;package=${PACKAGE};component=${ACTIVITY};end`;
        // Domain intent (fallback)
        const intentDomain = `intent://${DOMAIN}/${path}#Intent;scheme=https;package=${PACKAGE};end`;

        return { arsaScheme, intentMain, intentDomain };
      }

      function setupLaunchButton(videoId, playlistId, artistId) {
        const { arsaScheme, intentMain, intentDomain } = buildDeepLink(videoId, playlistId, artistId);

        btnOpen.href = intentMain;
        btnOpen.onclick = (e) => {
          e.preventDefault();
          const start = Date.now();

          // 1. Explicit component intent
          window.location.href = intentMain;

          // 2. ARSA custom scheme
          setTimeout(() => {
            if (document.hidden || Date.now() - start > 1500) return;
            window.location.href = arsaScheme;
          }, 200);

          // 3. Domain intent
          setTimeout(() => {
            if (document.hidden || Date.now() - start > 1500) return;
            window.location.href = intentDomain;
          }, 500);
        };
      }

      async function resolveTrack(urlStr) {
        const { videoId, playlistId, artistId } = parseMedia(urlStr);

        // Check URL hint params (set by ShareHelper on the server)
        const u         = new URL(window.location.href);
        const hintTitle = u.searchParams.get('title');
        const hintThumb = u.searchParams.get('thumb');
        const hintAuthor= u.searchParams.get('author');

        if (videoId) {
          const maxres = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
          const hq     = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

          if (hintThumb) {
            coverArt.src = hintThumb;
            coverArt.onerror = () => { coverArt.src = maxres; };
          } else {
            coverArt.src = maxres;
            coverArt.onerror = () => { coverArt.src = hq; };
          }

          setupLaunchButton(videoId, null, null);

          if (hintTitle) {
            songName.textContent   = hintTitle;
            songArtist.textContent = hintAuthor || 'A.R.S.A';
            if (metaTitle) metaTitle.textContent = `${hintTitle} — A.R.S.A`;
          } else {
            try {
              const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
              if (res.ok) {
                const data = await res.json();
                songName.textContent   = data.title       || `Track (${videoId})`;
                songArtist.textContent = data.author_name || 'A.R.S.A';
                if (metaTitle) metaTitle.textContent = `${data.title} — A.R.S.A`;
              } else {
                songName.textContent   = `Track ID: ${videoId}`;
                songArtist.textContent = 'A.R.S.A';
              }
            } catch (e) {
              songName.textContent   = `Track ID: ${videoId}`;
              songArtist.textContent = 'A.R.S.A';
            }
          }

        } else if (playlistId) {
          songName.textContent   = hintTitle  || 'Shared Playlist';
          songArtist.textContent = hintAuthor || `Playlist (${playlistId})`;
          coverArt.src = hintThumb || "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&q=85";
          setupLaunchButton(null, playlistId, null);

        } else if (artistId) {
          songName.textContent   = hintTitle  || 'Artist Channel';
          songArtist.textContent = hintAuthor || `Artist (${artistId})`;
          coverArt.src = hintThumb || "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1200&q=85";
          setupLaunchButton(null, null, artistId);
        }
      }

      // Init
      const currentUrl = window.location.href;
      const initial    = parseMedia(currentUrl);
      if (initial.videoId || initial.playlistId || initial.artistId) {
        resolveTrack(currentUrl);
      } else {
        // Default demo: Numb - Linkin Park
        resolveTrack('https://listen.aryavl.com/watch?v=kXYiU_JCYtU');
      }
    })();
  </script>
</body>
</html>
